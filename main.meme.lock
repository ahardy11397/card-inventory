      "canonical_meme": "use storage\nuse commands\nif argument count < 2:\n    print \"usage: cards <command> [args...]\"\n    exit with code 1\ndefine cmd: String as argument 1\nif cmd == \"help\":\n    define rc_help: Int as cmd_help()\n    exit with code rc_help\nif cmd == \"init\":\n    define rc_init: Int as cmd_init()\n    exit with code rc_init\nif not file exists \"cards.csv\":\n    print \"no cards.csv \\u2014 run: cards init\"\n    exit with code 1\nif cmd == \"add\":\n    define rc_add: Int as cmd_add()\n    exit with code rc_add\nif cmd == \"list\":\n    define rc_list: Int as cmd_list()\n    exit with code rc_list\nif cmd == \"show\":\n    define rc_show: Int as cmd_show()\n    exit with code rc_show\nif cmd == \"set\":\n    define rc_set: Int as cmd_set()\n    exit with code rc_set\nif cmd == \"remove\":\n    define rc_remove: Int as cmd_remove()\n    exit with code rc_remove\nif cmd == \"photo\":\n    define rc_photo: Int as cmd_photo()\n    exit with code rc_photo\nif cmd == \"photos\":\n    define rc_photos: Int as cmd_photos()\n    exit with code rc_photos\nif cmd == \"check\":\n    define rc_check: Int as cmd_check()\n    exit with code rc_check\nif cmd == \"stats\":\n    define rc_stats: Int as cmd_stats()\n    exit with code rc_stats\nprint \"unknown command: \" + cmd\nexit with code 1",
